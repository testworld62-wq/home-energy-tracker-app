services:
  mysql:
    image: mysql:8.0
    container_name: user-service-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: shahid
      MYSQL_DATABASE: home_energy_tracker
      MYSQL_USER: shahid
      MYSQL_PASSWORD: shahid

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - microservices-net

  postgres:
    image: postgres:16
    container_name: device-service-postgres
    restart: always

    environment:
      POSTGRES_DB: home_energy_tracker
      POSTGRES_USER: shahid
      POSTGRES_PASSWORD: shahid

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - microservices-net

volumes:
  mysql_data:
  postgres_data:

networks:
  microservices-net: